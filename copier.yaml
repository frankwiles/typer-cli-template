# Template configuration
_subdirectory: template
_templates_suffix: .jinja

# Project information
project_name:
  type: str
  help: Your project name (e.g., my_cli_project)
  default: my_cli_project

package_name:
  type: str
  help: Python package name (e.g., my_cli_project)
  default: "{{ project_name|lower|replace('-', '_')|replace(' ', '_') }}"

cli_name:
  type: str
  help: CLI command name (e.g., mycli)
  default: "{{ project_name|lower|replace('_', '-')|replace(' ', '-') }}"

description:
  type: str
  help: A short description of the project
  default: A modern Python CLI tool

author_name:
  type: str
  help: Your name
  default: Frank Wiles

license:
  type: str
  help: License for the project
  default: MIT
  choices:
    - MIT
    - Apache-2.0
    - BSD-3-Clause
    - GPL-3.0

python_version:
  type: str
  help: Minimum Python version
  default: "3.12"

use_commands_folder:
  type: bool
  help: Use commands/ folder structure for subcommands?
  default: true
